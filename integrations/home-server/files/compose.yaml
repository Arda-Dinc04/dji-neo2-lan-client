services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_ORIGIN: https://example.com
      HOME_SERVER_ALLOWED_EMAIL: operator@example.com
      NEO2_CONTROL_ENABLED: ${NEO2_CONTROL_ENABLED:-false}
      NEO2_CONTROL_SOCKET: /run/neo2-control/flight.sock
    volumes:
      - /run/neo2-control:/run/neo2-control:ro
    restart: unless-stopped
    networks:
      default: {}
      manaty:
        aliases:
          - home_server_api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5173
      PUBLIC_API_BASE_URL: https://example.com/home-server
    restart: unless-stopped
    depends_on:
      - api
    networks:
      default: {}
      manaty:
        aliases:
          - home_server_web

networks:
  manaty:
    external: true
    name: manaty_default
